version: 2
updates:
  # Python dependencies (pyproject.toml, incl. dev/api/openai/live extras).
  # The uv ecosystem rather than pip: uv.lock is committed and the licences job
  # resolves it with `uv sync --locked`, so a bump that edits pyproject.toml and
  # leaves the lock behind fails CI. uv updates both in the one PR.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # A group covers version updates only unless it says otherwise, which is
      # why four security advisories arrived as four separate PRs. Security
      # updates need their own group to be batched the same way.
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
